<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unmarkdown — paste markdown, read it beautifully</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FAF9F5;--slate:#141413;--clay:#D97757;--oat:#E3DACC;--olive:#788C5D;--gray-150:#F0EEE6;--gray-300:#D1CFC5;--gray-500:#87867F;--gray-700:#3D3D3A;--white:#FFF;--serif:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--mono);background:var(--ivory);color:var(--gray-700);line-height:1.55;padding:32px 20px 80px;-webkit-font-smoothing:antialiased;letter-spacing:-0.006em;font-feature-settings:"calt" 1,"liga" 1}
.page{max-width:1120px;margin:0 auto}
.page.reading{max-width:1120px}
h1{font-family:var(--serif);font-weight:500;font-size:32px;color:var(--slate);margin-bottom:6px}
.sub{font-size:14px;color:var(--gray-500);margin-bottom:20px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topbar h1{margin-bottom:2px}
.view{display:none}
.view.on{display:block}
.panel{background:var(--white);border:1.5px solid var(--gray-300);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.phead{background:var(--gray-150);padding:10px 16px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);display:flex;justify-content:space-between;align-items:center;gap:8px}
textarea{border:0;outline:0;resize:vertical;min-height:420px;padding:16px;font-family:var(--mono);font-size:14px;line-height:1.6;color:var(--slate);background:var(--white)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border:1.5px solid var(--gray-300);background:var(--white);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--slate)}
button.primary{background:var(--slate);color:var(--white);border-color:var(--slate)}
button:hover{border-color:var(--clay)}
.doc{padding:28px 32px;min-height:420px;font-family:var(--mono);font-size:16px;line-height:1.75}
.doc h1,.doc h2,.doc h3{font-family:var(--serif);color:var(--slate);margin:20px 0 8px;line-height:1.25}
.doc h1{font-size:32px}.doc h2{font-size:26px}.doc h3{font-size:21px}
.doc p{margin:10px 0;font-size:16px}
.doc ul{list-style:none;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.doc ul li{display:flex;gap:9px;font-size:15px}
.doc ul li::before{content:"–";color:var(--clay);font-weight:700}
.doc li.task{align-items:flex-start}
.doc li.task::before{content:none}
.box{flex:none;width:15px;height:15px;border:1.5px solid var(--gray-500);border-radius:4px;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.box.on{background:var(--olive);border-color:var(--olive)}
.doc code{font-family:var(--mono);font-size:12.5px;background:var(--gray-150);padding:1px 6px;border-radius:6px}
.doc pre{background:var(--slate);color:#EDEAE2;border-radius:10px;padding:14px 16px;overflow:auto;margin:12px 0}
.doc pre code{background:none;padding:0;color:inherit}
.doc table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;background:#fff;border:1.5px solid var(--gray-300);border-radius:12px;overflow:hidden}
.doc th{background:var(--gray-150);text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate)}
.doc td{padding:10px 14px;border-top:1px solid var(--gray-150)}
.doc blockquote{border-left:3px solid var(--clay);background:var(--gray-150);border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0;font-size:13.5px}
.doc hr{border:0;border-top:1.5px solid var(--gray-300);margin:20px 0}
.doc a{color:var(--clay)}
.toc{background:var(--gray-150);border:1.5px solid var(--gray-300);border-radius:10px;padding:14px 18px;font-size:13.5px}
.toc .tlabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);display:block;margin-bottom:8px}
.tstats{font-size:12px;color:var(--gray-500);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--gray-300)}
.toc a{display:block;color:var(--gray-700);text-decoration:none;padding:2px 0;line-height:1.5}
.toc a:hover{color:var(--clay)}
.toc a.lv2{padding-left:16px}
.toc a.lv3{padding-left:32px;color:var(--gray-500)}
.read-layout{display:block}
.toc-rail{display:none}
@media(min-width:1280px){
.toc-rail{display:block;position:fixed;right:24px;top:50%;transform:translateY(-50%);width:230px;max-height:70vh;overflow:auto;z-index:10}
.toc-rail.hidden{display:none}
.toc-fab{display:inline-block}
}
.toc-fab{display:none}
@media(max-width:1279px){
.toc-top{display:block;margin-bottom:16px}
.toc-rail{display:none}
}
@media(min-width:1280px){.toc-top{display:none}}
.empty{color:var(--gray-500);font-size:14px;text-align:center;padding:80px 20px}
</style>
</head>
<body>
<div class="page" id="page">
<div class="view on" id="view-in">
<div class="topbar"><div><h1>Unmarkdown</h1>
<div class="sub">Drop in messy markdown, read a beautiful doc. Private by design — nothing leaves this page.</div></div></div>
<div class="panel">
<div class="phead"><span>Markdown input</span><span class="toolbar"><button id="b-sample">Sample</button><button id="b-clear">Clear</button><button id="b-go" class="primary">Render →</button></span></div>
<textarea id="in" placeholder="# Paste SPEC.md / tasks/plan.md / any skill output here..."></textarea>
</div>
</div>
<div class="view" id="view-out">
<div class="topbar"><div><h1>Unmarkdown</h1>
<div class="sub">Drop in messy markdown, read a beautiful doc. Private by design — nothing leaves this page.</div></div><div class="toolbar"><button id="toc-fab" class="toc-fab">Contents</button><button id="b-edit">← Edit</button><button id="b-new">New paste</button></div></div>
<div class="read-layout">
<details class="toc toc-top" id="toc-top" style="display:none"><summary style="cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500)">Contents · <span id="count-top"></span></summary><div class="tstats" id="tstats-top"></div><div id="toc-top-body"></div></details>
<div class="sub" id="count-fallback" style="display:none;margin-bottom:12px"></div>
<div class="panel">
<div class="doc" id="out"></div>
</div>
<aside class="toc toc-rail" id="toc" style="display:none"><div class="tstats" id="tstats"></div><div id="toc-body"></div></aside>
</div>
</div>
</div>
<script>
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function slug(s){return s.toLowerCase().replace(/[`*_~]/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60)}
function render(md){
var lines=md.split('\n'),html='',i=0,inCode=false,codeBuf=[],toc=[];
function closeList(){if(html.endsWith('</li>'))html+='</ul>'}
while(i<lines.length){
var ln=lines[i];
if(/^```/.test(ln)){if(!inCode){inCode=true;codeBuf=[]}else{inCode=false;html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>'}i++;continue}
if(inCode){codeBuf.push(ln);i++;continue}
if(/^\s*$/.test(ln)){i++;continue}
var h=ln.match(/^(#{1,3})\s+(.*)/);
if(h){closeList();var l=h[1].length;var id=slug(h[2])+'-'+toc.length;toc.push({l:l,t:h[2].replace(/[*`]/g,''),id:id});html+='<h'+l+' id="'+id+'">'+inline(h[2])+'</h'+l+'>';i++;continue}
if(/^\s*---+\s*$/.test(ln)){html+='<hr>';i++;continue}
if(/^\s*>\s?/.test(ln)){var b=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){b.push(lines[i].replace(/^\s*>\s?/,''));i++}html+='<blockquote>'+inline(b.join(' '))+'</blockquote>';continue}
if(/^\s*\|/.test(ln)){
var rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++}
rows=rows.filter(function(r){return!/^\s*\|[\s\-:|]+\|\s*$/.test(r)});
html+='<table><tr>'+rows[0].split('|').filter(function(c){return c.trim()}).map(function(c){return '<th>'+inline(c.trim())+'</th>'}).join('')+'</tr>';
for(var r=1;r<rows.length;r++){html+='<tr>'+rows[r].split('|').filter(function(c){return c.trim()}).map(function(c){return '<td>'+inline(c.trim())+'</td>'}).join('')+'</tr>'}
html+='</table>';continue}
var task=ln.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)/);
if(task){if(!html.endsWith('</li>')&&!html.endsWith('</ul>')||html.endsWith('</table>')||html.endsWith('</pre>')||html.endsWith('</blockquote>')){if(!/<ul>$/.test(html))html+='<ul>'}var done=/[xX]/.test(task[1]);html+='<li class="task"><span class="box'+(done?' on':'')+'">'+(done?'✓':'')+'</span><span>'+inline(task[2])+'</span></li>';if(i+1>=lines.length||!/^\s*[-*]\s+/.test(lines[i+1]))html+='</ul>';i++;continue}
var li=ln.match(/^\s*[-*]\s+(.*)/);
if(li){html+='<ul><li><span>'+inline(li[1])+'</span></li>';if(i+1>=lines.length||!/^\s*[-*]\s+/.test(lines[i+1]))html+='</ul>';else{/* keep open */html=html.replace(/<\/ul>$/,'')}var open=(html.match(/<ul>/g)||[]).length-(html.match(/<\/ul>/g)||[]).length;if(i+1<lines.length&&!/^\s*[-*]\s+/.test(lines[i+1])){for(var k=0;k<open;k++)html+='</ul>'}i++;continue}
var ol=ln.match(/^\s*\d+\.\s+(.*)/);
if(ol){html+='<p><b>'+esc(ln.match(/^\s*(\d+)\./)[1])+'.</b> '+inline(ol[1])+'</p>';i++;continue}
html+='<p>'+inline(ln)+'</p>';i++;
}
var tocHtml='';
if(toc.length>1){tocHtml='<span class="tlabel">Contents · '+toc.length+' sections</span>'+toc.map(function(h){return '<a class="lv'+h.l+'" href="#'+h.id+'">'+esc(h.t)+'</a>'}).join('')}
return {html:html,tocHtml:tocHtml,toc:toc};
}
function statsOf(md){var words=(md.replace(/```[\s\S]*?```/g,' ').replace(/[#>*`|\-[\]()]/g,' ').match(/\S+/g)||[]).length;var mins=Math.max(1,Math.ceil(words/200));return {words:words,mins:mins}}
function show(which){$('view-in').classList.toggle('on',which==='in');$('view-out').classList.toggle('on',which==='out');$('page').classList.toggle('reading',which==='out');window.scrollTo(0,0)}
function go(){
var md=$('in').value;
if(!md.trim()){return}
var r=render(md);var s=statsOf(md);
$('out').innerHTML=r.html;
var stats=s.words+' words · '+s.mins+' min read · '+md.split('\n').length+' lines';
if(r.toc.length>1){$('toc-body').innerHTML=r.tocHtml;$('toc').style.display='';$('toc-top').style.display='';$('toc-top-body').innerHTML=r.tocHtml;$('tstats').textContent=stats;$('tstats-top').textContent=stats;$('count-top').textContent=stats;$('toc-fab').style.display='';$('count-fallback').style.display='none'}else{$('toc-body').innerHTML='';$('toc').style.display='none';$('toc-top').style.display='none';$('toc-top-body').innerHTML='';$('toc-fab').style.display='none';$('count-fallback').textContent=stats;$('count-fallback').style.display=''}
try{localStorage.setItem('md-presenter:last',md)}catch(e){}
show('out');
}
$('b-go').onclick=go;
$('b-edit').onclick=function(){show('in');$('in').focus()};
$('b-new').onclick=function(){$('in').value='';show('in');$('in').focus()};
$('toc-fab').onclick=function(){var t=$('toc');t.classList.toggle('hidden')};
$('b-clear').onclick=function(){$('in').value='';$('in').focus()};
$('b-sample').onclick=function(){$('in').value='# Ship checklist (Step 8)\n\n- [x] Tests: 10/10 streak tests pass\n- [x] Browser: mark-done → streak badge updates\n- [ ] Deploy: any static host\n\n## 4. Streak rules\n\n| Case | Result |\n| --- | --- |\n| today missing | start from yesterday |\n| missed day | reset to 0 |\n\n> Grace: today not done yet doesn\'t break streak.\n\n```\nlocalStorage key: habit-tracker:v1\n```\n';go()};
try{var last=localStorage.getItem('md-presenter:last');if(last){$('in').value=last}}catch(e){}
</script>
</body>
</html>
